name: VetMate iOS simulator
on:
  push:
    branches: [ios-development]
    paths:
      - 'ios/**'
      - '.github/workflows/vetmate-ios.yml'
      - 'index.html'
      - 'vetmate-hero-v22.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Bundle approved web assets
        run: |
          mkdir -p ios/Web
          cp index.html vetmate-hero-v22.js ios/Web/
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Compile unsigned simulator app
        working-directory: ios
        run: |
          xcodebuild -project VetMate.xcodeproj -scheme VetMate -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Save simulator build
        uses: actions/upload-artifact@v4
        with:
          name: VetMate-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/VetMate.app
          if-no-files-found: error

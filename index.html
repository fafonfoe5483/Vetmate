patientView=function(){const p=current();if(!p){H().innerHTML=heading('Patients','Patient profiles','Photos, patient details and calculation history.')+'<input id="patientSearch" placeholder="Search patients…" oninput="profileList(this.value)" aria-label="Search patients"><div class="subnav">'+['All','Dog','Cat'].map(t=>'<button class="'+(t===patientFilter?'chosen':'')+'" onclick="vmPatientFilter(\''+t+'\')">'+({All:'All',Dog:'Dogs',Cat:'Cats'}[t])+'</button>').join('')+'</div><button class="primary wide" onclick="editProfile(false)">＋ Create new patient</button><div id="profileList"></div><button class="toplink" onclick="legacyHistory()">Earlier records</button>';profileList('');return}
const tabs=['Overview','History','Notes','Calculate'];H().innerHTML='<button class="toplink" onclick="selected=null;render()">‹ All patients</button><div class="profile-banner">'+avatar(p)+'<div><h2>'+esc(p.name)+'</h2><small>'+esc(p.species+(p.breed?' · '+p.breed:''))+'</small><br><small>'+esc(p.sex||'')+'</small></div></div><div class="stats"><div><small>Weight</small><strong>'+esc(safeWeight(p))+'</strong></div><div><small>Patient ID</small><strong>'+esc(p.ref||'Not entered')+'</strong></div><div><small>Birth date</small><strong>'+esc(p.dob||'Not entered')+'</strong></div></div><div class="actions"><button onclick="editProfile(true)">Edit profile</button><button class="primary" onclick="vmProfileTab(\'Calculate\')">＋ Calculation</button></div><div class="subnav">'+tabs.map(t=>'<button class="'+(t===profileTab?'chosen':'')+'" onclick="vmProfileTab(\''+t+'\')">'+t+'</button>').join('')+'</div><div id="profileBody"></div>';
let b=$('profileBody');if(profileTab==='Calculate'){b.innerHTML='<div class="context">Saved weight is a starting value. Confirm it is current.</div><input placeholder="Search formulas…" oninput="query=this.value;library()"><div id="catalog"></div>';query='';library();return}if(profileTab==='Notes'){b.innerHTML='<div class="panel"><h3>Allergies</h3><p>'+esc(p.allergies||'Not recorded')+'</p><h3>Health notes</h3><p>'+esc(p.note||'No notes recorded')+'</p><button onclick="editProfile(true)">Edit notes</button></div>';return}if(profileTab==='Overview'){b.innerHTML='<div class="stats"><div><small>Allergies</small><strong>'+esc(p.allergies||'Not recorded')+'</strong></div><div><small>Health notes</small><strong>'+esc(p.note||'None entered')+'</strong></div><div><small>Saved records</small><strong>'+history.filter(r=>r.profileId===p.id).length+'</strong></div></div>'}b.innerHTML+='<div class="sectionline"><h3>'+(profileTab==='History'?'Calculation timeline':'Recent calculations')+'</h3><button onclick="vmProfileTab(\'History\')">View all</button></div><div class="timeline" id="profileHistory"></div><button class="wide" onclick="exportProfile()">Export calculation CSV</button><p class="disclaimer">Saved calculations document math only, not confirmation that treatment was administered.</p>';profileHistory()};
profileHistory=function(){let list=history.filter(r=>r.profileId===selected).sort((a,b)=>new Date(b.time)-new Date(a.time));if(profileTab==='Overview')list=list.slice(0,4);$('profileHistory').innerHTML=list.map(r=>'<div class="entry"><div class="recordtop"><div><strong>'+esc(r.name)+'</strong><small>'+esc(new Date(r.time).toLocaleString())+'</small></div><b>'+esc(r.result)+'</b></div><details><summary>View calculation details</summary><p>'+esc([r.drug,r.reason].filter(Boolean).join(' · '))+'</p><small>'+esc(r.details.join(' • '))+'<br>'+esc(r.formula)+'</small><div class="actions"><button onclick="deleteProfileRecord('+Number(r.id)+')">Delete record</button></div></details></div>').join('')||'<p class="muted">No saved calculations yet.</p>'};
editProfile=function(edit){let p=edit?current():null;oldEdit(edit);let form=$('pf');$('preview').parentElement.classList.add('profile-photo');$('preview').parentElement.classList.remove('profile-photo');$('preview').classList.add('profile-photo');$('preview').style.display='grid';$('preview').style.placeItems='center';$('preview').querySelector('.avatar')?.style.setProperty('width','90px');$('preview').querySelector('.avatar')?.style.setProperty('height','90px');$('pn').insertAdjacentHTML('afterend','<label for="breed">Breed (optional)</label><input id="breed" value="'+esc(p?.breed||'')+'"><label for="sex">Sex (optional)</label><select id="sex"><option value="">Not recorded</option>'+['Female','Male','Spayed female','Neutered male'].map(s=>'<option '+(p?.sex===s?'selected':'')+'>'+s+'</option>').join('')+'</select><label for="dob">Birth date (optional)</label><input type="date" id="dob" value="'+esc(p?.dob||'')+'">');$('note').insertAdjacentHTML('beforebegin','<label for="allergy">Allergies (optional)</label><input id="allergy" value="'+esc(p?.allergies||'')+'">');form.onsubmit=e=>{e.preventDefault();let name=$('pn').value.trim();if(!name)return;let kg=$('pw').value?Number($('pw').value)*($('pu').value==='lb'?.45359237:1):null;if(kg!==null&&(!Number.isFinite(kg)||kg<=0))return alert('Check weight');let item={...p,id:p?.id||uid(),name,ref:$('pr').value,species:$('ps').value,kg,note:$('note').value,photo:photoDraft,breed:$('breed').value,sex:$('sex').value,dob:$('dob').value,allergies:$('allergy').value};let next=[...profiles.filter(x=>x.id!==item.id),item];if(!persist('vm-profiles',next))return;profiles=next;profileTab='Overview';selectProfile(item.id)}};
calcView=function(){oldCalcUI();let panel=H().querySelector('.panel');if(!panel)return;let f=panel.querySelector('form');const explain=panel.querySelector('details');if(f&&explain)f.after(explain);if($('weightunit')){let sel=$('weightunit'),inp=$('v0'),wrap=document.createElement('div');wrap.className='formgroup';sel.before(wrap);wrap.append(inp,sel)}};
drugGuide=function(){H().innerHTML=heading('Drugs','Drug library','Search canine and feline medication references.')+'<input id="dq" placeholder="Search drug or brand…" oninput="drugList()" aria-label="Search medications"><p class="muted">'+meds.length+' educational entries · Verify with the veterinarian.</p><div id="drugList"></div><div class="panel"><h3>Official references</h3><a href="https://animaldrugsatfda.fda.gov/adafda/views/#/search" target="_blank" rel="noopener">Animal Drugs @ FDA</a><br><a href="https://dailymed.nlm.nih.gov/dailymed/" target="_blank" rel="noopener">DailyMed product labels</a></div>';drugList()};
drugList=function(){let q=$('dq').value.toLowerCase();$('drugList').innerHTML=meds.filter(m=>m.join(' ').toLowerCase().includes(q)).sort((a,b)=>a[0].localeCompare(b[0])).map(m=>'<details class="panel drugrow"><summary><span class="tile-icon">'+vmIcon('Drugs')+'</span><span><strong>'+esc(m[0])+'</strong><br><small>'+esc(m[1]+' · '+m[2])+'</small></span></summary><span class="chip">'+esc(m[2])+'</span><h3>Why it is used</h3><p>'+esc(m[3])+'</p><h3>Why the dose varies</h3><p>Species, indication, route, formulation, patient health and the veterinarian’s order determine the dose.</p><p class="warn">Educational reference only. Verify the exact product and prescribed dose before calculating.</p></details>').join('')||'<p>No matching entries.</p>'};
render=function(){const names=[['Quick','Home','Home'],['Patients','Patients','Patients'],['Drugs','Drug library','Drugs'],['More','More','More']];$('nav').innerHTML=names.map(([k,t,i])=>'<button class="'+(page===k?'active':'')+'" aria-current="'+(page===k?'page':'false')+'" onclick="nav(\''+k+'\')">'+vmIcon(i)+'<span>'+t+'</span></button>').join('');if(active){calcView();return}if(page==='Patients'){patientView();return}if(page==='Drugs'){drugGuide();return}if(page==='More'){H().innerHTML=heading('More','VetMate','Designed for the people who care.')+'<div class="panel"><h3>Favorites</h3><button class="wide" onclick="nav(\'Quick\');browse=true;render()">Manage favorite formulas</button><h3>About</h3><p>VetMate Premium · V1.7 design update</p><p>Local browser storage only, no cloud sync. Use fictional patients. Not clinically validated or a prescribing tool.</p><p>Made for the hands that care. 💙</p></div>';return}page='Quick';if(browse){H().innerHTML='<button class="toplink" onclick="browse=false;render()">‹ Home</button>'+heading('Quick','All formulas','Star the calculations you use most.')+'<input id="search" placeholder="Search formulas…" value="'+esc(query)+'" oninput="query=this.value;library()"><div id="catalog"></div>';library();return}H().innerHTML='<div class="hero"><small>CANINE + FELINE CARE</small><h2>Calculate.<br>Understand.<br>Care.</h2><p>Less math. More care.</p>'+vmArt+'</div><div class="sectionline"><h3>Your favorites</h3><button onclick="browse=true;render()">Edit ★</button></div>'+tiles(fav.map(id=>lib.find(f=>f.id===id)).filter(Boolean))+'<div class="homefooter"><button onclick="browse=true;render()">Browse all '+lib.length+' formulas ›</button></div><div class="panel"><strong>Quick calculations</strong><p class="muted">No patient required. Attach a result to a profile afterward if needed.</p></div>'};
document.querySelector('header h1').innerHTML='Vet<span style="color:#159dff">Mate</span>';document.querySelector('header p').textContent='Less math. More care.';document.querySelector('header .edition').textContent='V1.7 · DOG + CAT';render();
})();
</script></html>

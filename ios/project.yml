name: VetMate
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 89KEN9U38P
targets:
  VetMate:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vetmate.clinicalassistant
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: VetMate AI
        INFOPLIST_KEY_NSCameraUsageDescription: Take patient and medication label photos for optional identification.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose patient or medication label photos.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
